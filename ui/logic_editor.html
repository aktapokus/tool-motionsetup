let LOCALE = {};

// Bu paylaşılan durum değişkenleri BİLEREK burada, dosyanın en başında —

// oturumda birkaç kez yaşanan gerçek bir hataydı, bilerek buraya alındı.
let extractedVars = { input: [], output: [], local: [] };
let declManuallyEdited = false;
// "Sol listeye ekle" butonunun hangi değişkenleri ekleyeceğini bilmesi için

// aynı TDZ deseni yüzünden (renderDeclarations render() ile ÇOK ERKEN
// çağrılıyor) burada, dosyanın başında tanımlı.
let latestNewVars = [];
// parseStToBlockXml (aşağıda tanımlı) satır-sonu yorumları taşımak için bu
// iki işaretçiyi kullanıyor — "Robot"/"Motion" toolbox şablonlarını inşa
// eden kod (installTemplateCategories) parseStToBlockXml'i Blockly.inject'ten
// ÖNCE, yani bunların eski konumundan (dosyanın çok daha aşağısı) ÖNCE
// çağırıyordu; TDZ nedeniyle preprocessStSource içeride ReferenceError

// aynı çözüm: paylaşılan sabitleri dosyanın en başına alıyoruz.
const TRAIL_START = String.fromCharCode(1);
const TRAIL_END = String.fromCharCode(2);

async function loadLocale(lang) {
  const fallback = lang === "en" ? T_FALLBACK_EN : T_FALLBACK_TR;
  try {
    const res = await fetch("/api/tools/" + TOOL_ID + "/locale/" + lang + "?token=" + encodeURIComponent(AUTH_TOKEN));
    if (!res.ok) return fallback;
    const server = await res.json();
    return Object.assign({}, fallback, server);
  } catch (e) {
    return fallback;
  }
}

function t(key, vars) {
  let s = LOCALE[key];
  if (s === undefined || s === null) s = key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}

// =====================================================================
// Ana başlatma — locale yüklenene KADAR Blockly enjekte edilmiyor, çünkü
// blok tooltip/sağ-tık metinleri init() içinde t() ile üretiliyor.
// =====================================================================
(async function main() {
  LOCALE = await loadLocale(currentLang());
  applyStaticI18n();
  renderVarLists();

// --- st_var'ın NAME alanı için değişken adı otomatik tamamlama: tuvalde
// bir bloğun içine (ör. bir matematik işleminin A/B yuvasına) bir değişken
// adı yazarken, GİRİŞLER/ÇIKIŞLAR/YEREL panellerinde zaten bilinen
// değişkenleri Visual Studio Code'daki IntelliSense gibi öneriyor. Yeni
// (henüz deklare edilmemiş) bir isim yazmaya devam etmek de serbest —
// sadece BİLİNENLERİ önerip yazmayı engellemiyoruz.
function getKnownVarNames() {
  const names = [];
  const seen = new Set();
  ["input", "output", "local"].forEach(function (bucket) {
    (extractedVars[bucket] || []).forEach(function (v) {
      if (!seen.has(v.name)) { seen.add(v.name); names.push(v.name); }
    });
  });
  return names;
}

function attachFieldAutocomplete(field) {
  const inputEl = field.htmlInput_;
  if (!inputEl) return;
  const dropdown = document.createElement("div");
  dropdown.className = "type-ac-dropdown";
  dropdown.style.position = "fixed";
  dropdown.style.display = "none";
  document.body.appendChild(dropdown);

  let matches = [];
  let activeIndex = -1;
  let closed = false;

  function close() {
    if (closed) return;
    closed = true;
    document.removeEventListener("keydown", onKeydown, true);
    if (dropdown.parentNode) dropdown.parentNode.removeChild(dropdown);
  }

  function renderList() {
    dropdown.innerHTML = "";
    matches.forEach(function (name, idx) {
      const item = document.createElement("div");
      item.className = "type-ac-item" + (idx === activeIndex ? " active" : "");
      item.textContent = name;
      item.addEventListener("mousedown", function (e) { e.preventDefault(); commit(name); });
      dropdown.appendChild(item);
    });
  }

  function commit(name) {
    inputEl.value = name;
    inputEl.dispatchEvent(new Event("input", { bubbles: true }));
    inputEl.blur();
    close();
  }

  function update() {
    const typed = inputEl.value;
    if (!typed) { dropdown.style.display = "none"; matches = []; return; }
    const upper = typed.toUpperCase();
    matches = getKnownVarNames().filter(function (n) {
      return n.toUpperCase().indexOf(upper) === 0 && n.toUpperCase() !== upper;
    });
    if (!matches.length) { dropdown.style.display = "none"; return; }
    activeIndex = 0;
    const rect = inputEl.getBoundingClientRect();
    dropdown.style.left = rect.left + "px";
    dropdown.style.top = rect.bottom + "px";
    dropdown.style.display = "block";
    renderList();
  }

  function onKeydown(e) {
    if (dropdown.style.display === "none") return;
    if (e.key === "ArrowDown") { e.preventDefault(); activeIndex = Math.min(matches.length - 1, activeIndex + 1); renderList(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); activeIndex = Math.max(0, activeIndex - 1); renderList(); }
    else if (e.key === "Tab") { if (activeIndex >= 0) { e.preventDefault(); commit(matches[activeIndex]); } }
    else if (e.key === "Escape") { dropdown.style.display = "none"; }
    // Enter'ı BİLEREK yakalamıyoruz — Blockly'nin kendi Enter davranışı
    // (editörü mevcut yazılan değerle commit edip kapatması) korunuyor,
    // ona müdahale etmek yeni bir hataya yol açabilirdi.
  }

  inputEl.addEventListener("input", update);
  document.addEventListener("keydown", onKeydown, true);
  inputEl.addEventListener("blur", function () { setTimeout(close, 150); });
}

class FieldVarAutocomplete extends Blockly.FieldTextInput {
  showEditor_(e) {
    Blockly.FieldTextInput.prototype.showEditor_.call(this, e);
    attachFieldAutocomplete(this);
  }
  static fromJson(options) {
    return new FieldVarAutocomplete(options["text"]);
  }
}
Blockly.fieldRegistry.register("field_var_autocomplete", FieldVarAutocomplete);

// --- Tek özel blok: IF ... THEN ... END_IF (ST'ye özel, PLC anlamında) ---
// --- Blok renkleri KATEGORİYE göre gruplanıyor (birbirine benzemeyen
// bloklar birbirine karışmasın diye — önceden çoğu rastgele/çakışan hue
// kullanıyordu, ör. st_for ve st_continue ikisi de kırmızıydı):
//   25  turuncu  = kontrol akışı   (IF, CASE, FOR, CONTINUE)
//   160 yeşil    = atama           (ASSIGN)
//   210 mavi     = mantık/karşılaştırma (COMPARE, LOGIC, NOT)
//   60  sarı     = değer/sabit     (VAR, TIME_LIT)
//   285 mor      = çağrı (statement)  (CALL, TIMER)
//   255 mor-mavi = çağrı (değer döndüren) (EXPR_CALL)
//   0   kırmızı  = yorum           (COMMENT) — artık sadece bunda kullanılıyor
Blockly.defineBlocksWithJsonArray([
  {
    "type": "st_compare",
    "message0": "%1 %2 %3",

// --- st_if: IF/THEN sabit, ELSIF kolları + opsiyonel ELSE dinamik (sağ-tık) ---
Blockly.Blocks['st_if'] = {
  init: function () {
    this.elseifCount_ = 0;
    this.hasElse_ = false;
    this.appendValueInput('IF0').appendField('IF').setCheck('Boolean');
    this.appendStatementInput('DO0').appendField('THEN');
    this.setPreviousStatement(true, null);
    this.setNextStatement(true, null);
    this.setColour(25);
    this.setTooltip(t('tooltip_if'));
  },
  mutationToDom: function () {
    const container = document.createElement('mutation');
    container.setAttribute('elseif', this.elseifCount_);
    container.setAttribute('else', this.hasElse_ ? 1 : 0);
    return container;
  },
  domToMutation: function (xmlElement) {
    this.elseifCount_ = parseInt(xmlElement.getAttribute('elseif'), 10) || 0;
    this.hasElse_ = xmlElement.getAttribute('else') === '1';
    this.updateShape_();
  },
  updateShape_: function () {
    const savedIfConns = {};
    const savedDoConns = {};
    let i = 1;
    while (this.getInput('IF' + i)) {
      savedIfConns[i] = this.getInput('IF' + i).connection.targetConnection;
      savedDoConns[i] = this.getInput('DO' + i).connection.targetConnection;
      this.removeInput('IF' + i);
      this.removeInput('DO' + i);
      i++;
    }
    let savedElseConn = null;
    if (this.getInput('ELSE')) {
      savedElseConn = this.getInput('ELSE').connection.targetConnection;
      this.removeInput('ELSE');
    }
    for (i = 1; i <= this.elseifCount_; i++) {
      this.appendValueInput('IF' + i).appendField('ELSIF').setCheck('Boolean');
      this.appendStatementInput('DO' + i).appendField('THEN');
    }
    if (this.hasElse_) {
      this.appendStatementInput('ELSE').appendField('ELSE');
    }
    for (i = 1; i <= this.elseifCount_; i++) {
      if (savedIfConns[i]) {
        try { this.getInput('IF' + i).connection.connect(savedIfConns[i]); } catch (e) {}
      }
      if (savedDoConns[i]) {
        try { this.getInput('DO' + i).connection.connect(savedDoConns[i]); } catch (e) {}
      }
    }
    if (this.hasElse_ && savedElseConn) {
      try { this.getInput('ELSE').connection.connect(savedElseConn); } catch (e) {}
    }
  },
  customContextMenu: function (options) {
    const block = this;
    options.push({
      text: t('ctx_add_elseif'),
      enabled: true,
      callback: function () { block.elseifCount_++; block.updateShape_(); }
    });
    if (this.elseifCount_ > 0) {
      options.push({
        text: t('ctx_remove_elseif'),
        enabled: true,
        callback: function () {
          const n = block.elseifCount_;
          const ifInput = block.getInput('IF' + n);
          const ifTarget = ifInput && ifInput.connection.targetBlock();
          if (ifTarget) ifTarget.dispose(false, true);
          const doInput = block.getInput('DO' + n);
          const doTarget = doInput && doInput.connection.targetBlock();
          if (doTarget) doTarget.dispose(false, true);
          block.elseifCount_--;
          block.updateShape_();
        }
      });
    }
    options.push({
      text: this.hasElse_ ? t('ctx_remove_else') : t('ctx_add_else'),
      enabled: true,
      callback: function () {
        if (block.hasElse_) {
          const input = block.getInput('ELSE');
          const target = input && input.connection.targetBlock();
          if (target) target.dispose(false, true);
        }
        block.hasElse_ = !block.hasElse_;
        block.updateShape_();
      }
    });
  }
};

// --- st_call/st_expr_call ortak yardımcılar ---
// Parametre etiketi alanı: boşsa ":=" hiç gösterilmez (pozisyonel çağrı gibi
// görünür, WORD_TO_TIME(x) örneğinde olduğu gibi) — kullanıcı bir isim
// yazdığı anda (veya silince) otomatik olarak updateShape_ tetiklenip ":="
// görünür/kaybolur. setTimeout: validator, alanın YENİ değeri commit
// edilmeden hemen önce çalışır; bir sonraki tick'te okursak güncel değeri görürüz.
// Sadece SONUNCU parametreyi değil, herhangi birini silebilmek için: mevcut
// tüm parametreleri (label+bağlı değer) oku, idx'teki hariç geri kalanları
// sıfırdan sırayla yeniden kur (boşluk kalmasın diye kaydırma yapılır).
function removeArgAt(block, idx) {
  const savedLabels = {};
  const savedConns = {};
  const savedDirs = {};
  let i = 0;
  while (block.getInput('ARG' + i)) {
    const lf = block.getField('ARGLABEL' + i);
    savedLabels[i] = lf ? lf.getValue() : '';
    savedConns[i] = block.getInput('ARG' + i).connection.targetConnection;
    savedDirs[i] = (block.argDirs_ && block.argDirs_[i]) || 'in';
    i++;
  }
  const n = i;
  if (savedConns[idx]) {
    const targetBlock = savedConns[idx].getSourceBlock();
    if (targetBlock) targetBlock.dispose(false, true);
  }
  const newLabels = {};
  const newConns = {};
  const newDirs = {};
  let w = 0;
  for (let k = 0; k < n; k++) {
    if (k === idx) continue;
    newLabels[w] = savedLabels[k];
    newConns[w] = savedConns[k];
    newDirs[w] = savedDirs[k];
    w++;
  }
  block.argCount_ = n - 1;
  block.updateShape_(newLabels, newConns, newDirs);
}

// ÖNEMLİ: buraya updateShape_'ı tetikleyen bir validator KOYMA — Blockly
// FieldTextInput validator'ı her TUŞ VURUŞUNDA çalışır, updateShape_ ise
// inputları söküp yeniden kurduğu için o an açık olan düzenleme kutusunu
// kapatır; kullanıcı her harften sonra Enter'a basılmış gibi bir davranış
// yaşar (gerçek bir hata olarak yaşandı, bilerek buraya not düşüldü).
// Bu yüzden ":=" görünürlüğü sadece bloğun KURULDUĞU/yeniden şekillendiği
// anda (parse, +/- parametre) belirleniyor — kullanıcı elle etiket
// yazdığında canlı güncellenmiyor, kabul edilebilir bir basitleştirme.
function makeArgLabelField(initial) {
  return new Blockly.FieldTextInput(initial);
}

// --- st_call: fonksiyon/prosedür çağrısı, ör. _NewProd(); veya Foo(a, b); ---
// GİRİŞ (:=) parametreleri ile ÇIKIŞ (=>) parametreleri artık AYRI görsel
// bölümlerde gösteriliyor (gerçek bir FB çağrısının input/output ayrımını
// yansıtsın diye — fbHomeXAxis gibi 20+ parametreli çağrılarda hepsi tek
// sütunda karışmasın). Alan adları (ARGn/ARGLABELn) yine de ORİJİNAL
// parse sırasına göre indeksleniyor — sadece hangi SATIRDA göründükleri
// (IN bölümü mü OUT bölümü mü) değişiyor, üretici (stGen) hâlâ 0..N-1
// sırayla okuyup orijinal kaynak sırasında kod üretiyor.
Blockly.Blocks['st_call'] = {
  init: function () {
    this.argCount_ = 0;
    this.argDirs_ = [];
    this.setInputsInline(false);
    this.setPreviousStatement(true, null);
    this.setNextStatement(true, null);
    this.setColour(285);
    this.setTooltip(t('tooltip_call'));
    this.updateShape_();
  },
  mutationToDom: function () {
    const container = document.createElement('mutation');
    container.setAttribute('args', this.argCount_);
    container.setAttribute('dirs', (this.argDirs_ || []).map(function (d) { return d === 'out' ? 'o' : 'i'; }).join(''));
    return container;
  },
  domToMutation: function (xmlElement) {
    this.argCount_ = parseInt(xmlElement.getAttribute('args'), 10) || 0;
    const dirsAttr = xmlElement.getAttribute('dirs') || '';
    this.argDirs_ = [];
    for (let k = 0; k < this.argCount_; k++) this.argDirs_[k] = dirsAttr[k] === 'o' ? 'out' : 'in';
    this.updateShape_();
  },
  updateShape_: function (overrideLabels, overrideConns, overrideDirs) {
    // Parametre yoksa TEK SATIR: "Ad ( ) ;" — _HwLimits(); gibi çağrılar
    // gereksiz yere iki satıra bölünmesin. Parametre varsa st_if'in
    // ELSIF/ELSE satırları gibi her biri kendi satırında alt alta dizilir.
    // Fonksiyon çağrısının parametre SAYISI zaten çağrılan fonksiyonun
    // imzasına bağlı olduğu için (CASE kolu gibi keyfi değil) ekle/sil
    // görünür buton değil, sağ-tık menüsünde — daha az "her an değişebilir"
    // izlenimi versin diye. overrideLabels/overrideConns/overrideDirs:
    // removeArgAt() belirli bir parametreyi (sonuncu olması şart değil)
    // silip kalanları sıfırdan sırayla kurarken kullanır.
    let savedConns, savedLabels, savedDirs;
    let i = 0;
    if (overrideLabels) {
      savedLabels = overrideLabels;
      savedConns = overrideConns;
      savedDirs = overrideDirs || {};
      while (this.getInput('ARG' + i)) { this.removeInput('ARG' + i); i++; }
    } else {
      savedConns = {};
      savedLabels = {};
      savedDirs = {};
      while (this.getInput('ARG' + i)) {
        savedConns[i] = this.getInput('ARG' + i).connection.targetConnection;
        const lf = this.getField('ARGLABEL' + i);
        if (lf) savedLabels[i] = lf.getValue();
        savedDirs[i] = (this.argDirs_ && this.argDirs_[i]) || 'in';
        this.removeInput('ARG' + i);
        i++;
      }
      // Yukarıdaki while sadece ŞU AN VAR OLAN ARG girdilerini kapsıyor —
      // domToMutation'ın ilk updateShape_ çağrısında (mutation'daki
      // argCount_/argDirs_ YENİ set edilmiş ama girdiler henüz hiç
      // oluşturulmamış) bu döngü hiç çalışmaz ve savedDirs boş kalırdı,
      // her parametre sessizce IN'e düşerdi (=> hiç görünmezdi). Eksik
      // kalan indeksleri doğrudan this.argDirs_'ten tamamlıyoruz.
      for (let k = 0; k < this.argCount_; k++) {
        if (savedDirs[k] === undefined) savedDirs[k] = (this.argDirs_ && this.argDirs_[k]) || 'in';
      }
    }
    let funcName = '_NewProd';
    const fnField = this.getField('FUNC_NAME');
    if (fnField) funcName = fnField.getValue();
    if (this.getInput('HEAD')) this.removeInput('HEAD');
    if (this.getInput('OUTHEAD')) this.removeInput('OUTHEAD');
    if (this.getInput('TAIL')) this.removeInput('TAIL');

    const head = this.appendDummyInput('HEAD')
      .appendField(new Blockly.FieldTextInput(funcName), 'FUNC_NAME')
      .appendField('(');

    if (this.argCount_ === 0) {
      head.appendField(')').appendField(';');
    } else {
      const inIdxs = [];
      const outIdxs = [];
      for (i = 0; i < this.argCount_; i++) {
        ((savedDirs[i] || 'in') === 'out' ? outIdxs : inIdxs).push(i);
      }
      const self = this;
      const renderRow = function (idx) {
        const inp = self.appendValueInput('ARG' + idx).setAlign(Blockly.inputs.Align.RIGHT);
        const label = savedLabels[idx] || '';
        inp.appendField(makeArgLabelField(label), 'ARGLABEL' + idx);
        if (label) inp.appendField(savedDirs[idx] === 'out' ? '=>' : ':=');
      };
      inIdxs.forEach(renderRow);
      if (outIdxs.length) this.appendDummyInput('OUTHEAD').appendField(t('out_section_label'));
      outIdxs.forEach(renderRow);
      this.appendDummyInput('TAIL').appendField(')').appendField(';');
    }
    for (i = 0; i < this.argCount_; i++) {
      if (savedConns[i]) {
        try { this.getInput('ARG' + i).connection.connect(savedConns[i]); } catch (e) {}
      }
    }
    this.argDirs_ = [];
    for (i = 0; i < this.argCount_; i++) this.argDirs_[i] = savedDirs[i] || 'in';
  },
  customContextMenu: function (options) {
    const block = this;
    options.push({
      text: t('ctx_add_param'),
      enabled: true,
      callback: function () {
        block.argDirs_ = block.argDirs_ || [];
        block.argDirs_[block.argCount_] = 'in';
        block.argCount_++;
        block.updateShape_();
      }
    });
    for (let idx = 0; idx < this.argCount_; idx++) {
      const lf = this.getField('ARGLABEL' + idx);
      const label = lf ? lf.getValue() : '';
      const paramName = label || ('#' + (idx + 1));
      options.push({
        text: t('ctx_remove_param_named', { name: paramName }),
        enabled: true,
        callback: (function (fixedIdx) {
          return function () { removeArgAt(block, fixedIdx); };
        })(idx)
      });
    }
  }
};

// --- ST generator ---
const stGen = new Blockly.Generator("ST");
stGen.PRECEDENCE = 0;
// Blockly'nin kendi Generator.blockToCode'u devre dışı blokları scrub_'a hiç
// uğratmadan atlıyor (kodu tamamen kayboluyor) — biz devre dışı bloğun
// kodunu YORUM SATIRINA çevirmek istediğimiz için bunu kendimiz yazıyoruz,
// forBlock'u her zaman çağırıp scrub_'a devrediyoruz.
stGen.blockToCode = function (block, opt_thisOnly) {
  if (!block) return "";
  const func = this.forBlock[block.type];
  if (!func) throw Error('"ST" bu blok tipini üretemiyor: ' + block.type);
  const code = func.call(block, block);
  if (Array.isArray(code)) return code;
  return this.scrub_(block, code, opt_thisOnly);
};
stGen.scrub_ = function (block, code, thisOnly) {
  // Bloğun üstündeki Blockly'nin yerleşik "yorum" balonu (sağ tık: Add Comment)
  // varsa, kaynak koddaki gibi bağımsız bir // satırı olarak bloğun ÖNÜNE ekle.
  let result = code;
  if (block.isEnabled && !block.isEnabled()) {
    // Sağ tık "Disable Block" ile kapatılmış bloklar: ürettiği TÜM satırlar
    // (iç içe gövdesi dahil) // ile yorum satırına çevrilir, silinmez —
    // tekrar "Enable Block" denince normale döner.
    result = code.split("\n").map(function (line) {
      return line.trim() ? "//" + line : line;
    }).join("\n");
  } else {
    const commentText = block.getCommentText ? block.getCommentText() : "";
    if (commentText && !block.outputConnection) {
      const commentLines = commentText.split("\n").map(function (l) { return "//" + l; }).join("\n");
      result = commentLines + "\n" + code;
    }
  }
  const next = block.nextConnection && block.nextConnection.targetBlock();
  if (next && !thisOnly) return result + this.blockToCode(next);
  return result;
};

// --- IEC 61131-3 öncelik sırası (gevşekten sıkıya):
// OR/XOR < AND < karşılaştırma < toplama/çıkarma < çarpma/bölme/MOD < NOT/atomik. ---
const ORDER_ANY = 0;
const ORDER_OR = 1;
const ORDER_AND = 2;
const ORDER_COMPARE = 3;
const ORDER_ADD = 4;
const ORDER_MUL = 5;
const ORDER_NOT = 7;
const ORDER_ATOMIC = 8;

function stValue(block, inputName, requiredOrder, fallback) {
  const target = block.getInputTargetBlock(inputName);
  if (!target) return fallback;
  const fn = stGen.forBlock[target.type];
  if (!fn) return fallback;
  const pair = fn(target);
  const code = pair[0], order = pair[1];
  // Kaynak kodda kullanıcının açıkça yazdığı parantezler (data="forceParens"
  // ile işaretli, bkz. parseAtom) precedence gereksiz kılsa bile korunur.
  if (target.data === "forceParens") return "(" + code + ")";
  return order < requiredOrder ? "(" + code + ")" : code;
}

stGen.forBlock = {
  st_if: function (block) {
    const cond0 = stValue(block, "IF0", ORDER_ANY, "TRUE");
    const body0 = stGen.statementToCode(block, "DO0");
    let out = `IF ${cond0} THEN\n${body0}`;
    for (let i = 1; i <= block.elseifCount_; i++) {
      const cond = stValue(block, "IF" + i, ORDER_ANY, "TRUE");
      const body = stGen.statementToCode(block, "DO" + i);
      out += `ELSIF ${cond} THEN\n${body}`;
    }
    if (block.hasElse_) {
      const els = stGen.statementToCode(block, "ELSE");
      out += `ELSE\n${els}`;
    }
    out += `END_IF;\n`;
    return out;
  },
  st_compare: function (block) {
    const a = stValue(block, "A", ORDER_COMPARE, "0");
    const b = stValue(block, "B", ORDER_COMPARE, "0");
    const op = block.getFieldValue("OP");
    return [`${a} ${op} ${b}`, ORDER_COMPARE];
  },
  st_var: function (block) {
    return [block.getFieldValue("NAME"), ORDER_ATOMIC];
  },
  st_logic: function (block) {
    const op = block.getFieldValue("OP");
    const opOrder = op === "AND" ? ORDER_AND : ORDER_OR;
    const a = stValue(block, "A", opOrder, "FALSE");
    const b = stValue(block, "B", opOrder, "FALSE");
    return [`${a} ${op} ${b}`, opOrder];
  },
  st_not: function (block) {
    const a = stValue(block, "A", ORDER_NOT, "FALSE");
    return [`NOT ${a}`, ORDER_NOT];
  },
  st_math: function (block) {
    const op = block.getFieldValue("OP");
    const opOrder = (op === "*" || op === "/" || op === "MOD") ? ORDER_MUL : ORDER_ADD;
    const a = stValue(block, "A", opOrder, "0");
    // "-" ve "/" (ve MOD) DEĞİŞMELİ (commutative) DEĞİL — blok editörde
    // kullanıcı sağ tarafa AYNI önceliğe sahip bir alt-ifade sürükleyip
    // "10 - (5 - 2)" gibi bir şey kurabilir; parantezsiz basarsak
    // "10 - 5 - 2" çıkar ki bu YANLIŞ bir değer verir (3 yerine 7 olmalı).
    // Sağ tarafı bir üst önceliğe zorlayarak (eşit bile olsa) bu durumda
    // parantez eklenmesini garantiliyoruz.
    const nonCommutative = (op === "-" || op === "/" || op === "MOD");
    const b = stValue(block, "B", nonCommutative ? opOrder + 1 : opOrder, "0");
    return [`${a} ${op} ${b}`, opOrder];
  },
  st_case: function (block) {
    const expr = stValue(block, "EXPR", ORDER_ANY, "0");
    let out = `CASE ${expr} OF\n`;
    for (let i = 1; i <= block.caseCount_; i++) {
      const label = block.getFieldValue("LABEL" + i);
      const body = stGen.statementToCode(block, "DO" + i);
      out += `${label}:\n${body}`;
    }
    if (block.hasElse_) {
      const els = stGen.statementToCode(block, "ELSE");
      out += `ELSE\n${els}`;
    }
    out += `END_CASE;\n`;
    return out;
  },
  st_time_lit: function (block) {
    return [block.getFieldValue("TXT"), ORDER_ATOMIC];
  },
  st_timer: function (block) {
    const inVal = stValue(block, "IN", ORDER_ANY, "FALSE");
    const ptVal = stValue(block, "PT", ORDER_ANY, "T#0MS");
    return `${block.getFieldValue("INSTANCE")}(IN:=${inVal}, PT:=${ptVal});\n`;
  },
  st_call: function (block) {
    const args = [];
    for (let i = 0; i < block.argCount_; i++) {
      // fallback "" (0 değil): bağlanmamış bir ARG girişi gerçek kodda
      // "label:= ," gibi değeri hiç yazılmamış bir parametreyi temsil
      // ediyor olabilir — "0" basmak yanlış bir değer uydurmuş olurdu.
      const val = stValue(block, "ARG" + i, ORDER_ANY, "");
      const label = block.getFieldValue("ARGLABEL" + i);
      const op = (block.argDirs_ && block.argDirs_[i] === "out") ? "=>" : ":=";
      args.push(label ? `${label}${op}${val}` : val);
    }
    return `${block.getFieldValue("FUNC_NAME")}(${args.join(", ")});\n`;
  },
  st_assign: function (block) {
    const val = stValue(block, "VALUE", ORDER_ANY, "0");
    return `${block.getFieldValue("NAME")} := ${val};\n`;
  },
  st_comment: function (block) {
    return `//${block.getFieldValue("TXT")}\n`;
  },
  st_expr_call: function (block) {
    const args = [];
    for (let i = 0; i < block.argCount_; i++) {
      const val = stValue(block, "ARG" + i, ORDER_ANY, "");
      const label = block.getFieldValue("ARGLABEL" + i);
      const op = (block.argDirs_ && block.argDirs_[i] === "out") ? "=>" : ":=";
      args.push(label ? `${label}${op}${val}` : val);
    }
    return [`${block.getFieldValue("FUNC_NAME")}(${args.join(", ")})`, ORDER_ATOMIC];
  },
  math_number: function (block) {
    return [String(block.getFieldValue("NUM")), ORDER_ATOMIC];
  },
  st_for: function (block) {
    const startVal = stValue(block, "START", ORDER_ANY, "0");
    const endVal = stValue(block, "END", ORDER_ANY, "0");
    const body = stGen.statementToCode(block, "DO");
    return `FOR ${block.getFieldValue("VAR")} := ${startVal} TO ${endVal} DO\n${body}END_FOR;\n`;
  },
  st_continue: function (block) {
    return `CONTINUE;\n`;
  }
};

// Bir bloğu tuttuğunda ekranın altına/kenarına doğru sürüklerken tuvalin
// KENDİLİĞİNDEN kaymaması gerçek bir şikayetti — kullanıcı bırak/kaydır/
// tekrar tut yapmak zorunda kalıyordu (Blockly çekirdeği sürükleme
// SIRASINDA otomatik kaydırma yapmıyor, sadece boş tuvali elle sürükleyerek
// kaydırmaya izin veriyor). Burada bloğu tutup imleci #blocklyDiv'in
// kenarına yaklaştırdıkça workspace'i otomatik kaydıran basit bir
// requestAnimationFrame döngüsü ekliyoruz.
(function setupAutoScrollWhileDragging() {
  const EDGE = 40;         // px — bu mesafeden yakınken kaydırma başlar
  const MAX_SPEED = 16;    // px / adım — kenara tam yapışınca (ya da dışına taşınca) en hızlı
  const INTERVAL_MS = 16;  // ~60/sn — requestAnimationFrame YERİNE setTimeout kullanılıyor,
                            // çünkü bazı ortamlarda (headless/arka plandaki sekme gibi)
                            // rAF hiç tetiklenmeyebiliyor; setTimeout her koşulda çalışır.
  let lastClientX = null;
  let lastClientY = null;
  let timerId = null;

  function edgeSpeed(pos, nearEdge, farEdge, sign) {
    // nearEdge: EDGE-bandının tuval içindeki sınırı, farEdge: tuvalin dış
    // sınırı (rect.top/rect.bottom vb.). İmleç EDGE bandının içindeyken
    // KADEMELİ hızlanır; tuvalin TAMAMEN DIŞINA taştığında (kullanıcı fareyi
    // kenardan öteye götürdüğünde — gerçek kullanımda çok olan bir durum)
    // sabit MAX_SPEED ile devam eder, "dışarı çıkınca kaydırma durur" gibi
    // ters bir davranışa düşmesin diye.
    const dist = sign > 0 ? (pos - nearEdge) : (nearEdge - pos);
    if (dist <= 0) return 0;
    return sign * MAX_SPEED * Math.min(1, dist / EDGE);
  }

  function tick() {
    timerId = null;
    if (typeof workspace.isDragging !== "function" || !workspace.isDragging()) return;
    if (lastClientX === null) { timerId = setTimeout(tick, INTERVAL_MS); return; }
    const rect = document.getElementById("blocklyDiv").getBoundingClientRect();
    let dx = 0, dy = 0;
    if (lastClientY < rect.top + EDGE) dy = edgeSpeed(lastClientY, rect.top + EDGE, rect.top, -1);
    else if (lastClientY > rect.bottom - EDGE) dy = edgeSpeed(lastClientY, rect.bottom - EDGE, rect.bottom, 1);
    if (lastClientX < rect.left + EDGE) dx = edgeSpeed(lastClientX, rect.left + EDGE, rect.left, -1);
    else if (lastClientX > rect.right - EDGE) dx = edgeSpeed(lastClientX, rect.right - EDGE, rect.right, 1);
    if (dx || dy) {
      // GERÇEK KÖK NEDEN (uzun bir hata avından sonra bulundu): tuvalin
      // GERÇEK kayma durumu getMetrics().scrollLeft/scrollTop'ta DEĞİL,
      // workspace.scrollX / workspace.scrollY CANLI özelliklerinde tutuluyor.
      const newX = workspace.scrollX - dx;
      const newY = workspace.scrollY - dy;
      if (Number.isFinite(newX) && Number.isFinite(newY)) {
        // NOT: Daha önce burada, tutulan bloğun kaydırma sırasında imleçle
        // birlikte kalması için sentetik bir pointermove (ve ayrıca
        // workspace.moveDrag()) ile Blockly'nin kendi sürükleme durumunu
        // "zorla" güncellemeyi denedim. İkisi de gerçek kullanımda
        // sürüklemenin YERİNDE DONMASINA yol açtı (workspace.moveDrag
        // ekran-pikseli değil farklı bir koordinat sistemi bekliyor ve
        // NaN/SVGPoint hatası fırlatıyordu; sentetik pointermove ise
        // Blockly'nin gesture takibini bozuyor olabilir). Bu, "tuval hiç
        // kaymıyor" durumundan DAHA KÖTÜ bir bug (sürükleme tamamen
        // kilitleniyor). Bu yüzden BİLEREK sadece tuvali kaydırıyoruz —
        // tutulan blok kaydırma sırasında görsel olarak birazcık geride
        // kalabilir ama sürükleme asla kilitlenmiyor/bozulmuyor.
        workspace.scroll(newX, newY);
      }
    }
    timerId = setTimeout(tick, INTERVAL_MS);
  }

  function onPointerLike(e) {
    lastClientX = e.clientX;
    lastClientY = e.clientY;
    if (timerId === null && typeof workspace.isDragging === "function" && workspace.isDragging()) {
      timerId = setTimeout(tick, INTERVAL_MS);
    }
  }
  // ÖNEMLİ: Blockly kendi sürükleme mantığında pointer olaylarını kullanıyor
  // ve muhtemelen preventDefault() çağırıyor — bu da tarayıcının pointer
  // olaylarından ürettiği "uyumluluk" mousemove olaylarını BASTIRIYOR.
  // Sadece "mousemove" dinlemek gerçek kullanımda (sentetik event'lerle
  // yapılan testte değil) HİÇ tetiklenmiyordu — bu yüzden hem pointermove
  // hem mousemove dinleniyor, capture aşamasında (Blockly'nin kendi
  // handler'larından önce/bağımsız çalışsın diye).
  document.addEventListener("pointermove", onPointerLike, true);
  document.addEventListener("mousemove", onPointerLike, true);
})();

// --- Tip alanı için basit bir otomatik tamamlama: "ad : I" yazınca IEC
// 61131-3 standart tiplerinden ("INT", "IEC..." vb.) eşleşenleri öneren
// küçük bir açılır liste. Gerçek bir kod editörü değil düz <textarea>
// olduğu için imlecin TAM piksel konumunu takip etmek yerine (kırılgan bir
// "mirror div" hilesi gerektirirdi) satır numarasına göre YAKLAŞIK bir
// dikey konum hesaplıyoruz — yeterince kullanışlı, çok daha az riskli. ---
const IEC_TYPES = [
  "BOOL", "BYTE", "WORD", "DWORD", "LWORD",
  "SINT", "INT", "DINT", "LINT", "USINT", "UINT", "UDINT", "ULINT",
  "REAL", "LREAL",
  "TIME", "DATE", "TOD", "DT",
  "STRING", "WSTRING", "CHAR", "WCHAR"
];

function attachTypeAutocomplete(textareaEl) {
  const dropdown = document.createElement("div");
  dropdown.className = "type-ac-dropdown";
  dropdown.style.display = "none";
  textareaEl.parentNode.style.position = textareaEl.parentNode.style.position || "relative";
  textareaEl.parentNode.appendChild(dropdown);

  let activeIndex = -1;
  let currentMatches = [];
  let fragStart = -1, fragEnd = -1;

  function currentLineAndFragment() {
    const val = textareaEl.value;
    const pos = textareaEl.selectionStart;
    const lineStart = val.lastIndexOf("\n", pos - 1) + 1;
    const lineUpToCursor = val.slice(lineStart, pos);
    const colonIdx = lineUpToCursor.lastIndexOf(":");
    if (colonIdx === -1) return null;
    const afterColon = lineUpToCursor.slice(colonIdx + 1);
    const trimmed = afterColon.replace(/^\s+/, "");
    // Tip parçası boşluk/noktalı virgül içeriyorsa kullanıcı zaten yazımı
    // bitirmiş demektir — öneri göstermeye gerek yok (aşağıdaki return null).
    if (/\s/.test(trimmed) || trimmed.indexOf(";") !== -1) return null;
    return {
      fragment: trimmed,
      start: lineStart + colonIdx + 1 + (afterColon.length - trimmed.length),
      end: pos
    };
  }

  function closeDropdown() {
    dropdown.style.display = "none";
    activeIndex = -1;
    currentMatches = [];
  }

  function renderDropdown() {
    dropdown.innerHTML = "";
    currentMatches.forEach(function (typeName, idx) {
      const item = document.createElement("div");
      item.className = "type-ac-item" + (idx === activeIndex ? " active" : "");
      item.textContent = typeName;
      item.addEventListener("mousedown", function (e) {
        e.preventDefault();
        commit(typeName);
      });
      dropdown.appendChild(item);
    });
  }

  let suppressReopen = false;
  function commit(typeName) {
    const val = textareaEl.value;
    const newVal = val.slice(0, fragStart) + typeName + val.slice(fragEnd);
    textareaEl.value = newVal;
    const newPos = fragStart + typeName.length;
    textareaEl.setSelectionRange(newPos, newPos);
    closeDropdown();
    // Bu "input" olayı hem parseVarListTextarea'nın (yukarıda ayrı bir
    // dinleyicide bağlı) extractedVars'ı güncellemesi İÇİN gerekli, hem de
    // AYNI ZAMANDA bu fonksiyonun kendi 'input' dinleyicisini de tetikler —
    // yazılan tip zaten kendi öneri listesinde birebir eşleştiği için
    // (ör. "INT" yazınca "INT" öneriliyor) açılır liste hemen tekrar
    // açılıyordu. suppressReopen ile SADECE bu bir sonraki tetiklenmeyi
    // atlıyoruz, parseVarListTextarea'nın kendi dinleyicisi etkilenmiyor.
    suppressReopen = true;
    textareaEl.dispatchEvent(new Event("input", { bubbles: true }));
    textareaEl.focus();
  }

  textareaEl.addEventListener("input", function () {
    if (suppressReopen) { suppressReopen = false; return; }
    const info = currentLineAndFragment();
    if (!info || info.fragment.length === 0) { closeDropdown(); return; }
    const upper = info.fragment.toUpperCase();
    currentMatches = IEC_TYPES.filter(function (t) { return t.indexOf(upper) === 0; });
    if (!currentMatches.length) { closeDropdown(); return; }
    fragStart = info.start;
    fragEnd = info.end;
    activeIndex = 0;
    // Yaklaşık dikey konum: imlecin bulunduğu satır numarası * satır
    // yüksekliği (computed line-height'tan, boş bırakılmışsa 18px varsayılan).
    const val = textareaEl.value;
    const lineIndex = val.slice(0, textareaEl.selectionStart).split("\n").length - 1;
    const cs = getComputedStyle(textareaEl);
    let lineHeight = parseFloat(cs.lineHeight);
    if (!lineHeight || Number.isNaN(lineHeight)) lineHeight = parseFloat(cs.fontSize) * 1.4 || 18;
    const paddingTop = parseFloat(cs.paddingTop) || 0;
    const top = paddingTop + (lineIndex + 1) * lineHeight - textareaEl.scrollTop;
    dropdown.style.top = Math.max(0, Math.min(textareaEl.clientHeight, top)) + "px";
    dropdown.style.left = "8px";
    dropdown.style.display = "block";
    renderDropdown();
  });

  textareaEl.addEventListener("keydown", function (e) {
    if (dropdown.style.display === "none") return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      activeIndex = Math.min(currentMatches.length - 1, activeIndex + 1);
      renderDropdown();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      activeIndex = Math.max(0, activeIndex - 1);
      renderDropdown();
    } else if (e.key === "Enter" || e.key === "Tab") {
      if (activeIndex >= 0 && currentMatches[activeIndex]) {
        e.preventDefault();
        commit(currentMatches[activeIndex]);
      }
    } else if (e.key === "Escape") {
      closeDropdown();
    }
  });

  textareaEl.addEventListener("blur", function () {
    // Bir öneriye tıklama "mousedown"da zaten commit ediyor (blur'dan önce
    // çalışır); burada sadece geriye kalan durumu temizliyoruz.
    setTimeout(closeDropdown, 0);
  });
}

// Akordeon: hepsi başlangıçta kapalı, biri açılınca diğerleri otomatik kapanır
// (kullanıcı "çok küçük ekranlar olmuş, üstüne tıklayınca açılmalı, onun
// dışında toplanmalı" dedi — normal <details multi-open> yerine bu davranış).
const varDetailsIds = ["varDetailsInput", "varDetailsOutput", "varDetailsLocal"];

// ÖNEMLİ: <textarea> flex konteynerde flex:1 ile büyümüyor (bilinen tarayıcı
// garipliği — form elemanları flex-grow'a CSS ile düzgün uymuyor), o yüzden
// açık olan textarea'nın yüksekliğini burada elle, piksel cinsinden
// hesaplayıp veriyoruz — "aşağıya doğru uzun olmalı" isteği için gerekli.
function resizeOpenVarTextarea() {
  const panelRect = document.getElementById("varListPanel").getBoundingClientRect();
  varDetailsIds.forEach(function (id) {
    const details = document.getElementById(id);
    const textarea = details.querySelector("textarea");
    if (!details.open) { textarea.style.height = ""; return; }
    const summaryHeight = details.querySelector("summary").getBoundingClientRect().height;
    let othersHeight = 0;
    varDetailsIds.forEach(function (otherId) {
      if (otherId !== id) othersHeight += document.getElementById(otherId).getBoundingClientRect().height;
    });
    const available = panelRect.height - othersHeight - summaryHeight - 6;
    textarea.style.height = Math.max(70, available) + "px";
  });
}

varDetailsIds.forEach(function (id) {
  document.getElementById(id).addEventListener("toggle", function (e) {
    if (e.target.open) {
      varDetailsIds.forEach(function (otherId) {
        if (otherId !== id) document.getElementById(otherId).open = false;
      });
    }
    setTimeout(resizeOpenVarTextarea, 0);
  });
});
window.addEventListener("resize", resizeOpenVarTextarea);

// Sol panelin genişliği de canvas/çıktı arasındaki ayırıcı gibi sürüklenerek ayarlanabilir.

      // stGen.blockToCode [kod, öncelik] TUPLE'ı döndürüyor (değer
      // bloklarının iç kullanım sözleşmesi bu). Bunu olduğu gibi string'e
      // eklemek dizinin toString()'i virgülle birleştirdiği için
      // "i + j,4" gibi anlamsız bir çıktı üretiyordu — gerçek bir
      // kullanıcı ekran görüntüsüyle bulundu (blok := ile bir yere

// --- Değişken listesi çıkarma: VAR_INPUT/VAR_OUTPUT/VAR/VAR_IN_OUT/VAR CONSTANT ... END_VAR ---
// Her giriş artık {name, type} — sadece isim değil, gerçek IEC tipini de (AXM.ST_ModuleInterface,
// TON, ARRAY[...] OF X dahil) taşıyor, çünkü deklarasyon çıktısını yeniden üretebilmemiz gerekiyor.
// (Değişkenin kendisi en tepede, applyStaticI18n/renderVarLists'in ilk senkron
// çağrısından ÖNCE tanımlanıyor — TDZ hatası olmasın diye.)

function extractDeclVars(text) {
  const blockRe = /VAR(_INPUT|_OUTPUT|_IN_OUT)?(\s+CONSTANT)?\b[^\n]*\n([\s\S]*?)END_VAR/gi;
  const lineRe = /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*(?:AT\s+%\S+\s*)?:\s*([^;]+?)\s*;/;
  const out = { input: [], output: [], local: [] };
  const seen = new Set();
  let m;
  while ((m = blockRe.exec(text)) !== null) {
    // VAR CONSTANT da "local" kovasına düşer (basitlik için) — asıl önemli olan tipin doğru yakalanması.
    const kind = m[1] === "_INPUT" ? "input" : m[1] === "_OUTPUT" ? "output" : "local";
    m[3].split("\n").forEach(function (line) {
      const lm = lineRe.exec(line);
      if (lm && !seen.has(lm[1])) {
        seen.add(lm[1]);
        out[kind].push({ name: lm[1], type: lm[2].trim() });
      }
    });
  }
  return out;
}

// TYPE Ad : STRUCT alan1:tip1; ... END_STRUCT; END_TYPE bloklarını ayrıştırır.
// Şimdilik sadece TOPLANIP saklanıyor (structDefs) — derin tip çözümlemesi
// (bir değişkenin STRUCT tipine göre .alan erişimlerinin gerçek tipini bulma)
// henüz yok, bilinçli olarak sonraki adıma bırakıldı.
let structDefs = {};
function extractStructDefs(text) {
  const structRe = /TYPE\s+([A-Za-z_][A-Za-z0-9_]*)\s*:\s*STRUCT\b([\s\S]*?)END_STRUCT\s*;?\s*END_TYPE/gi;
  const lineRe = /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*:\s*([^;]+?)\s*;/;
  const defs = {};
  let m;
  while ((m = structRe.exec(text)) !== null) {
    const fields = {};
    m[2].split("\n").forEach(function (line) {
      const lm = lineRe.exec(line);
      if (lm) fields[lm[1]] = lm[2].trim();
    });
    defs[m[1]] = fields;
  }
  return defs;
}

// Gerçek projede doğrulanmış (Application.xml üzerinde istatistiksel) önek kuralları:
// Di_/i_ -> giriş, Dq_/q_ -> çıkış, c_/l_/Gc_/st_/ton_/tof_/ctu_/ctd_/vpq_/iq_ -> yerel/instance.
function classifyVarName(raw, writtenSet, readSet) {
  const lower = raw.toLowerCase();
  const inputPrefixes = ["di_", "i_"];
  const outputPrefixes = ["dq_", "q_"];
  const localPrefixes = ["c_", "l_", "gc_", "st_", "ton_", "tof_", "ctu_", "ctd_", "vpq_", "iq_"];
  for (const p of inputPrefixes) if (lower.startsWith(p)) return "input";
  for (const p of outputPrefixes) if (lower.startsWith(p)) return "output";
  for (const p of localPrefixes) if (lower.startsWith(p)) return "local";
  const w = writtenSet.has(raw), r = readSet.has(raw);
  if (w && r) return "local";
  if (w) return "output";
  return "input";
}

const ST_KEYWORDS = new Set([
  "IF", "THEN", "ELSE", "ELSIF", "END_IF", "CASE", "OF", "END_CASE",
  "FOR", "TO", "BY", "DO", "END_FOR", "WHILE", "END_WHILE",
  "REPEAT", "UNTIL", "END_REPEAT", "AND", "OR", "XOR", "NOT",
  "TRUE", "FALSE", "VAR", "VAR_INPUT", "VAR_OUTPUT", "VAR_IN_OUT",
  "END_VAR", "ARRAY", "STRUCT", "END_STRUCT", "TYPE", "END_TYPE",
  "RETURN", "EXIT", "CONTINUE", "MOD"
]);

function extractVarsFromUsage(text) {
  let t2 = text.replace(/\(\*[\s\S]*?\*\)/g, " ");
  t2 = t2.replace(/\/\/[^\n]*/g, " ");
  t2 = t2.replace(/'[^']*'/g, "''");
  t2 = t2.replace(/\b[A-Za-z]*#[0-9A-Za-z_]+/g, " ");

  const idRe = /[A-Za-z_][A-Za-z0-9_]*(?:\s*\.\s*[A-Za-z_][A-Za-z0-9_]*)*/g;
  const seen = new Set();
  const names = [];
  const written = new Set();
  const read = new Set();
  let m;
  while ((m = idRe.exec(t2)) !== null) {
    const raw = m[0].replace(/\s*\.\s*/g, ".");
    const root = raw.split(".")[0];
    if (ST_KEYWORDS.has(root.toUpperCase())) continue;
    const after = t2.slice(idRe.lastIndex);
    if (/^\s*\(/.test(after)) continue;
    if (/^\s*:=/.test(after)) {
      const before = t2.slice(0, m.index);
      const depth = (before.match(/\(/g) || []).length - (before.match(/\)/g) || []).length;
      if (depth > 0) continue;
      written.add(raw);
    } else {
      read.add(raw);
    }
    if (seen.has(raw)) continue;
    seen.add(raw);
    names.push(raw);
  }
  return { names: names, written: written, read: read };
}

function extractVarsFromText(text) {
  const decl = extractDeclVars(text);
  const declCount = decl.input.length + decl.output.length + decl.local.length;
  if (declCount) return { vars: decl, mode: "decl" };

  // Kullanımdan çıkarımda gerçek IEC tipini bilemeyiz — type: null olarak işaretleniyor,
  // deklarasyon paneli bunu görünce kullanıcıdan tip istemesi gerektiğini anlıyor.
  const usage = extractVarsFromUsage(text);
  const vars = { input: [], output: [], local: [] };
  usage.names.forEach(function (raw) {
    vars[classifyVarName(raw, usage.written, usage.read)].push({ name: raw, type: null });
  });
  return { vars: vars, mode: "usage" };
}

// --- Girişler/Çıkışlar/Yerel: Blockly kategori/flyout (pill-şekilli sürükle-
// bırak) DEĞİL — düz, DÜZENLENEBİLİR "ad : TİP;" metin listesi. Tıklama
// otomatik blok eklemez, sadece görüntüler; kullanıcı burada tipi
// değiştirebilir ya da yeni satır ekleyebilir. Elle yapılan değişiklikler
// extractedVars[bucket]'a geri yazılır ki bilinen-tip sistemi (deklarasyon
// paneli, "yeni değişken" uyarısı) bundan haberdar olsun.
const VARLIST_LINE_RE = /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*:\s*([^;]+?)\s*;?\s*$/;

function varListText(list) {
  if (!list.length) return "";
  return list.map(function (entry) {
    return entry.name + " : " + (entry.type || "???") + ";";
  }).join("\n") + "\n";
}

function renderVarLists() {
  document.getElementById("varListInput").value = varListText(extractedVars.input);
  document.getElementById("varListOutput").value = varListText(extractedVars.output);
  document.getElementById("varListLocal").value = varListText(extractedVars.local);
}

function parseVarListTextarea(bucket, textareaId) {
  const lines = document.getElementById(textareaId).value.split("\n");
  const out = [];
  const seen = new Set();
  lines.forEach(function (line) {
    const m = VARLIST_LINE_RE.exec(line);
    if (m && !seen.has(m[1])) {
      seen.add(m[1]);
      out.push({ name: m[1], type: m[2].trim() });
    }
  });
  extractedVars[bucket] = out;
}

// --- Deklarasyon paneli: workspace'te GERÇEKTEN kullanılan tüm değişkenleri
// tarar (st_var/st_assign'ın kök ismi + st_timer'ın instance adı — dizinin/alanın
// kendisi değil, deklare edilmesi gereken KÖK isim), bilinen tipleri (yapıştırılan
// deklarasyondan ya da Timer bloğunun TON/TOF seçiminden) eşler, hiç bilinmeyenleri
// "// YENİ — tip kontrol edilmeli" olarak işaretler. Kullanıcı yeni bir değişken
// eklediğinde sessizce kaybolmasın diye — bu panelin asıl amacı bu.
function rootVarName(raw) {
  const s = (raw || "").trim();
  if (!s) return null;
  if (s[0] === "'") return null;           // string literal
  if (/^[0-9]/.test(s)) return null;        // sayısal literal
  if (/^(TRUE|FALSE)$/i.test(s)) return null;
  const m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(s);
  if (!m) return null;
  if (ST_KEYWORDS.has(m[0].toUpperCase())) return null;
  return m[0];
}

function lookupKnownVar(name) {
  for (const kind of ["input", "output", "local"]) {
    const found = extractedVars[kind].find(function (v) { return v.name === name; });
    if (found) return { kind: kind, type: found.type };
  }
  return null;
}

// Gerçek önek kurallarına dayalı en iyi tahmin — kullanıcı deklarasyon
// yapıştırmadıysa ve bloklarda hiç görülmemiş yeni bir isim yazdıysa devreye girer.
function guessType(name) {
  const lower = name.toLowerCase();
  if (lower.startsWith("ton_")) return "TON";
  if (lower.startsWith("tof_")) return "TOF";
  if (lower.startsWith("ctu_")) return "CTU";
  if (lower.startsWith("ctd_")) return "CTD";
  if (lower.startsWith("r_trig_") || lower.startsWith("rt_")) return "R_TRIG";
  if (lower.startsWith("f_trig_") || lower.startsWith("ft_")) return "F_TRIG";
  if (lower.startsWith("i_x") || lower.startsWith("q_x") || lower.startsWith("di_") || lower.startsWith("dq_") || /^x[A-Z_]/.test(name)) return "BOOL";
  if (lower.startsWith("i_n") || lower.startsWith("q_n") || lower.startsWith("l_n") || /^n[A-Z_]/.test(name)) return "INT";
  if (lower.startsWith("i_lr") || lower.startsWith("lr")) return "LREAL";
  if (lower.startsWith("i_s") || /^s[A-Z_]/.test(name)) return "STRING";
  // Yaygın sayaç/indeks isimleri (i, j, k, n, m, idx, index, count...) —
  // Hungarian-notation önekleriyle eşleşmese de gerçek kodda (özellikle
  // FOR döngülerinde) çok sık görülüyor. "???" yerine INT gibi makul bir
  // varsayılan vermek daha kullanışlı — "// YENİ" uyarısı zaten kullanıcıyı
  // tipi kontrol etmeye yönlendiriyor, bu tahmin o uyarıyı KALDIRMIYOR.
  if (/^(i|j|k|m|n|idx|index|cnt|count)[0-9]*$/i.test(name)) return "INT";
  return "???";
}

// workspace'teki bloklardan gerçekten kullanılan kök değişken isimlerini toplar.
// st_timer için TON/TOF zaten dropdown'dan KESİN biliniyor — tahmine gerek yok.
function collectUsedVars() {
  const found = new Map();
  workspace.getAllBlocks(false).forEach(function (b) {
    if (b.type === "st_var" || b.type === "st_assign") {
      const root = rootVarName(b.getFieldValue("NAME"));
      if (root && !found.has(root)) found.set(root, null);
    } else if (b.type === "st_timer") {
      const inst = b.getFieldValue("INSTANCE");
      const fbtype = b.getFieldValue("FBTYPE");
      if (inst) found.set(inst, fbtype);
    }
  });
  return found;
}

function renderDeclSection(header, arr) {
  if (!arr.length) return "";
  let out = header + "\n";
  arr.forEach(function (v) {
    out += "    " + v.name + " : " + v.type + ";" + (v.isNew ? "  // YENİ" : "") + "\n";
  });
  out += "END_VAR\n";
  return out;
}

function computeDeclarationsText() {
  const used = collectUsedVars();
  const buckets = { input: [], output: [], local: [] };
  let newCount = 0;
  const newVars = [];
  used.forEach(function (knownType, name) {
    const known = lookupKnownVar(name);
    const kind = known ? known.kind : "local";
    const isNew = !known;
    const type = knownType || (known && known.type) || guessType(name);
    buckets[kind].push({ name: name, type: type, isNew: isNew });
    if (isNew) { newCount++; newVars.push({ name: name, type: type, kind: kind }); }
  });
  ["input", "output", "local"].forEach(function (k) {
    buckets[k].sort(function (a, b) { return a.name.localeCompare(b.name); });
  });
  const text = renderDeclSection("VAR_INPUT", buckets.input)
    + renderDeclSection("VAR_OUTPUT", buckets.output)
    + renderDeclSection("VAR", buckets.local);
  return { text: text, newCount: newCount, newVars: newVars };
}

// Sağdaki "Değişken Deklarasyonları" (tuvalde KULLANILAN her şeyi otomatik
// tarar) ile soldaki GİRİŞLER/ÇIKIŞLAR/YEREL paneli (elle tutulan/yapıştırılan
// referans listesi) BİLEREK iki ayrı sistem — kullanıcı gerçek kod
// yapıştırıp "Değişkenleri Ayrıştır" yaptığında soldaki liste TAM olarak o
// koddaki deklarasyonları yansıtsın, tuvaldeki geçici/deneme değişkenleri
// (ör. "i", "j") onu KİRLETMESİN diye. Ama kullanıcı "toplu olmasını
// tercih ederim" dedi — bu yüzden "// YENİ" olarak işaretlenen değişkenleri
// tek tıkla sol listeye de EKLEYEN bir buton ekliyoruz (otomatik/sessiz
// senkron değil, kullanıcı elle onaylıyor).
function addNewVarsToDeclarations() {
  latestNewVars.forEach(function (v) {
    const bucket = extractedVars[v.kind];
    if (!bucket.some(function (existing) { return existing.name === v.name; })) {
      bucket.push({ name: v.name, type: v.type });
    }
  });
  renderVarLists();
  renderDeclarations();
}

function renderDeclarations() {
  const result = computeDeclarationsText();
  if (!declManuallyEdited) {
    document.getElementById("declOut").value = result.text;
  }
  latestNewVars = result.newVars;
  const warnEl = document.getElementById("declWarning");
  if (result.newCount > 0) {
    warnEl.style.display = "flex";
    warnEl.textContent = "";
    const span = document.createElement("span");
    span.textContent = t("decl_new_var_tpl", { count: result.newCount });
    warnEl.appendChild(span);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "decl-add-left-btn";
    btn.textContent = t("decl_add_to_left_btn");
    btn.addEventListener("click", addNewVarsToDeclarations);
    warnEl.appendChild(btn);
  } else {
    warnEl.style.display = "none";
  }
}

document.getElementById("parseVarBtn").addEventListener("click", function () {
  const text = document.getElementById("varInput").value;
  const result = extractVarsFromText(text);
  extractedVars = result.vars;
  structDefs = extractStructDefs(text);
  const modeLabel = result.mode === "decl" ? t("mode_decl") : t("mode_usage");
  const total = extractedVars.input.length + extractedVars.output.length + extractedVars.local.length;
  const structCount = Object.keys(structDefs).length;
  let msg = total
    ? t("vars_found_tpl", { count: total, mode: modeLabel, input: extractedVars.input.length, output: extractedVars.output.length, local: extractedVars.local.length })
    : t("no_vars_found");
  if (structCount) msg += " " + t("struct_found_tpl", { count: structCount });
  document.getElementById("varResult").textContent = msg;
  renderVarLists();
});

// =====================================================================
// ST -> Blok ayrıştırıcı.
// =====================================================================
function xmlEscape(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function findTrailingCommentIndex(line) {
  let inStr = false;
  for (let k = 0; k < line.length - 1; k++) {
    if (line[k] === "'") inStr = !inStr;
    if (!inStr && line[k] === "/" && line[k + 1] === "/") return k;
  }
  return -1;
}
function preprocessStSource(text) {
  let t2 = text.replace(/\(\*[\s\S]*?\*\)/g, "\n");
  const lines = t2.split("\n");
  const outLines = [];
  for (const raw of lines) {
    const trimmed = raw.trim();
    if (trimmed === "") continue;
    if (/^\/\//.test(trimmed)) {
      // Gerçek ST string literal kaçırma kuralı ('' = tek bir ') kullanılıyor,
      // \' DEĞİL — parser'ın STR_RE'si de aynı kuralı bekliyor (bkz. aşağıda).
      // Gerçek kaynakta yorumun içinde apostrof olabilir ("Run's" gibi) —
      // bu daha önce parser'ı kırıyordu, gerçek bir örnekle bulunup düzeltildi.
      const txt = trimmed.replace(/^\/\//, "").replace(/'/g, "''");
      outLines.push("__CMT__('" + txt + "');");
      continue;
    }
    const trailIdx = findTrailingCommentIndex(raw);
    if (trailIdx === -1) {
      outLines.push(raw);
    } else {
      const code = raw.slice(0, trailIdx);
      const cmt = raw.slice(trailIdx + 2).trim().replace(new RegExp("[" + TRAIL_START + TRAIL_END + "]", "g"), "");
      if (code.trim() === "") continue;
      outLines.push(cmt ? code + TRAIL_START + cmt + TRAIL_END : code);
    }
  }
  return outLines.join("\n");
}

function chainBlockXml(blockXmls) {
  if (blockXmls.length === 0) return "";
  let result = blockXmls[blockXmls.length - 1];
  for (let k = blockXmls.length - 2; k >= 0; k--) {
    const idx = blockXmls[k].lastIndexOf("</block>");
    result = blockXmls[k].slice(0, idx) + "<next>" + result + "</next>" + blockXmls[k].slice(idx);
  }
  return result;
}

function StParseHatasi(msg, pos, src) {
  this.message = msg;
  this.pos = pos;
  this.context = src.slice(Math.max(0, pos - 40), pos) + " ▶▶▶ " + src.slice(pos, pos + 40);
}

function parseStToBlockXml(rawText) {
  const s = preprocessStSource(rawText);
  let i = 0;
  const n = s.length;

  // Gerçek kodda bir IF koşulu birden fazla satıra yayılabiliyor ve satır
  // sonu yorumu koşulun ORTASINDA kalabiliyor (örn. "... Hmi_xStop=FALSE
  // //yorum\nAND ...THEN"). preprocessStSource bu satır-sonu yorumunu
  // TRAIL_START/TRAIL_END işaretçileriyle sarıyor; bu işaretçi normalde
  // attachTrailingComment tarafından İFADENİN TAM BİTİMİNDE yakalanıp
  // gerçek bir yorum bloğuna dönüştürülüyor. Ama ifade henüz bitmemişken
  // (yukarıdaki gibi ortada) ws() bu işaretçiyi tanımadığı için parser
  // çöküyordu. Burada ws() işaretçiyi de (whitespace gibi) atlıyor —
  // ifade ortasındaki yorum metni bu durumda kaybolur ama en azından
  // parser çökmüyor. Gerçek satır-sonu yorumlar (ifade bittikten SONRA)
  // attachTrailingComment'te YAKALANIYOR çünkü o, bu ws()'i değil kendi
  // ham boşluk taramasını kullanıyor (bkz. attachTrailingComment).
  function ws() {
    while (i < n) {
      if (/\s/.test(s[i])) { i++; continue; }
      if (s[i] === TRAIL_START) {
        const end = s.indexOf(TRAIL_END, i + 1);
        if (end !== -1) { i = end + 1; continue; }
      }
      break;
    }
  }
  function atEnd() { ws(); return i >= n; }
  function kwAt(pos, kw) {
    const re = new RegExp("^" + kw, "i");
    if (!re.test(s.slice(pos))) return false;
    const after = s[pos + kw.length];
    return !after || !/[A-Za-z0-9_]/.test(after);
  }
  function peekKw(kw) { ws(); return kwAt(i, kw); }
  function eatKw(kw) { ws(); i += kw.length; }
  function eatCh(ch) { ws(); if (s[i] !== ch) throw new StParseHatasi("'" + ch + "' bekleniyordu", i, s); i++; }
  function tryEatCh(ch) { ws(); if (s[i] === ch) { i++; return true; } return false; }

  // ÖNCEDEN burada bir de sonda TEK bir "-10" gibi aritmetik son ek
  // yutuluyordu (ör. "q_alrLePos[4]-10" opak metin olarak) — artık gerçek
  // st_math blokları olduğu için bu son ek KALDIRILDI, "-"/"+" artık
  // parseAddSub tarafından gerçek bir ikili işlem olarak ele alınıyor.
  const IDENT_RE = /^[A-Za-z_][A-Za-z0-9_]*(?:\s*(?:\.\s*[A-Za-z_][A-Za-z0-9_]*|\[[^\]]*\]))*/;
  const STR_RE = /^'(?:[^']|'')*'/;
  const TYPEDLIT_RE = /^[A-Za-z]{1,6}#[0-9A-Za-z_]+/;
  const NUM_RE = /^[0-9]+(?:\.[0-9]+)?/;
  const CMP_OPS = ["<>", "<=", ">=", "=", "<", ">"];

  function matchIdentRaw() {
    ws();
    const m = IDENT_RE.exec(s.slice(i));
    if (!m) return null;
    i += m[0].length;
    return m[0].replace(/\s+/g, "");
  }

  function parseAtom() {
    ws();
    if (peekKw("NOT")) { eatKw("NOT"); const a = parseAtom(); return "<block type=\"st_not\"><value name=\"A\">" + a + "</value></block>"; }
    if (s[i] === "(") {
      i++;
      const e = parseExpr();
      eatCh(")");
      // Kullanıcı açıkça parantez yazmışsa (precedence'a güvenmek yerine),
      // bunu KORUYORUZ — gereksiz görünse de üretilen kodda kaldırmıyoruz.
      // Gerçek kod incelemesinde bulundu: "(A AND B) OR (C AND D)" gibi
      // XOR-benzeri desenlerde parantez, ileride araya bir terim daha
      // eklenirse precedence'a güvenmekten kaynaklanacak sessiz bug'ı
      // önlüyor — bakım açısından daha güvenli, o yüzden korunmalı.
      return e.replace(/^<block type="([^"]+)">/, "<block type=\"$1\"><data>forceParens</data>");
    }
    let m;
    if ((m = STR_RE.exec(s.slice(i)))) { i += m[0].length; return "<block type=\"st_var\"><field name=\"NAME\">" + xmlEscape(m[0]) + "</field></block>"; }
    if ((m = TYPEDLIT_RE.exec(s.slice(i)))) { i += m[0].length; return "<block type=\"st_time_lit\"><field name=\"TXT\">" + xmlEscape(m[0]) + "</field></block>"; }

    let atomText, isNumber;
    if ((m = NUM_RE.exec(s.slice(i)))) {
      i += m[0].length;
      atomText = m[0];
      isNumber = true;
    } else {
      const ident = matchIdentRaw();
      if (ident === null) throw new StParseHatasi("Beklenmeyen karakter (ifade bekleniyordu)", i, s);
      ws();
      if (s[i] === "(") {
        i++;
        const args = parseArgList();
        eatCh(")");
        return xmlExprCallBlock(ident, args);
      }
      atomText = ident;
      isNumber = false;
    }
    return "<block type=\"" + (isNumber ? "math_number" : "st_var") + "\"><field name=\"" + (isNumber ? "NUM" : "NAME") + "\">" + xmlEscape(atomText) + "</field></block>";
  }

  // --- Aritmetik: MOD/* /÷ (ORDER_MUL) sonra +/- (ORDER_ADD) — gerçek
  // st_math bloklarına ayrıştırılıyor artık (önceden düz metin hilesiydi).
  function parseMulDiv() {
    let left = parseAtom();
    while (true) {
      ws();
      let op = null;
      if (kwAt(i, "MOD")) { op = "MOD"; }
      else if (s[i] === "*") { op = "*"; }
      else if (s[i] === "/") { op = "/"; }
      if (!op) break;
      i += op.length;
      const right = parseAtom();
      left = "<block type=\"st_math\"><field name=\"OP\">" + op + "</field><value name=\"A\">" + left + "</value><value name=\"B\">" + right + "</value></block>";
    }
    return left;
  }

  function parseAddSub() {
    let left = parseMulDiv();
    while (true) {
      ws();
      let op = null;
      if (s[i] === "+") op = "+";
      else if (s[i] === "-") op = "-";
      if (!op) break;
      i += 1;
      const right = parseMulDiv();
      left = "<block type=\"st_math\"><field name=\"OP\">" + op + "</field><value name=\"A\">" + left + "</value><value name=\"B\">" + right + "</value></block>";
    }
    return left;
  }

  // Her argüman {label, xml, dir} olarak dönüyor — dir "in" (:=) ya da
  // "out" (=>). xml BOŞ (null) olabilir: "label:= ," ya da "label=> ,"
  // gibi değeri hiç yazılmamış parametreler gerçek kodda çok görülüyor
  // (bkz. fbHomeXAxis örneği) — bunları artık opak metin olarak değil,
  // GERÇEKTEN etiketli ama bağlanmamış bir değer yuvası olarak temsil
  // ediyoruz ki st_call/st_expr_call bunları IN/OUT olarak görsel
  // gruplayabilsin (bkz. updateShape_ içindeki iki-geçişli render).
  function parseArgList() {
    const args = [];
    ws();
    if (s[i] === ")") return args;
    while (true) {
      // Gerçek kodda sondan bir önceki argümandan sonra fazladan bir virgül
      // bırakılıp hiçbir şey yazılmadan direkt ")" ile kapatılan durumlar var
      // (ör. "i_xStart:= FALSE, );") — muhtemelen PLC IDE'sinin otomatik
      // biçimlendirmesinden kalma. Boş son argümanı sessizce atlıyoruz.
      ws();
      if (s[i] === ")") break;
      let label = "";
      let dir = "in";
      let val = null;
      let matched = false;
      const save = i;
      const maybeIdent = matchIdentRaw();
      if (maybeIdent !== null) {
        ws();
        if (s[i] === ":" && s[i + 1] === "=") {
          i += 2;
          ws();
          label = maybeIdent;
          dir = "in";
          matched = true;
          if (s[i] !== "," && s[i] !== ")") val = parseExpr();
        } else if (s[i] === "=" && s[i + 1] === ">") {
          i += 2;
          ws();
          label = maybeIdent;
          dir = "out";
          matched = true;
          if (s[i] !== "," && s[i] !== ")") val = parseExpr();
        } else { i = save; }
      } else { i = save; }
      if (!matched) {
        // ne ":=" ne "=>" — pozisyonel (etiketsiz) ifade, ör. Foo(a, b)
        val = parseExpr();
        dir = "in";
      }
      args.push({ label: label, xml: val, dir: dir });
      ws();
      if (s[i] === ",") { i++; continue; }
      break;
    }
    return args;
  }

  function argDirsStr(args) {
    return args.map(function (a) { return a.dir === "out" ? "o" : "i"; }).join("");
  }
  function argsFieldsXml(args) {
    let out = "";
    args.forEach(function (a, idx) {
      out += "<field name=\"ARGLABEL" + idx + "\">" + xmlEscape(a.label) + "</field>";
      if (a.xml !== null) out += "<value name=\"ARG" + idx + "\">" + a.xml + "</value>";
    });
    return out;
  }

  function xmlExprCallBlock(funcName, args) {
    let out = "<block type=\"st_expr_call\"><mutation args=\"" + args.length + "\" dirs=\"" + argDirsStr(args) + "\"></mutation>";
    out += "<field name=\"FUNC_NAME\">" + xmlEscape(funcName) + "</field>";
    out += argsFieldsXml(args);
    out += "</block>";
    return out;
  }

  function parseCompare() {
    const a = parseAddSub();
    ws();
    for (const op of CMP_OPS) {
      if (s.slice(i, i + op.length) === op) {
        i += op.length;
        const b = parseAddSub();
        return "<block type=\"st_compare\"><field name=\"OP\">" + xmlEscape(op) + "</field><value name=\"A\">" + a + "</value><value name=\"B\">" + b + "</value></block>";
      }
    }
    return a;
  }

  function parseAnd() {
    let left = parseCompare();
    while (peekKw("AND")) {
      eatKw("AND");
      const right = parseCompare();
      left = "<block type=\"st_logic\"><field name=\"OP\">AND</field><value name=\"A\">" + left + "</value><value name=\"B\">" + right + "</value></block>";
    }
    return left;
  }

  function parseExpr() {
    let left = parseAnd();
    while (peekKw("OR") || peekKw("XOR")) {
      const op = peekKw("OR") ? "OR" : "XOR";
      eatKw(op);
      const right = parseAnd();
      left = "<block type=\"st_logic\"><field name=\"OP\">" + op + "</field><value name=\"A\">" + left + "</value><value name=\"B\">" + right + "</value></block>";
    }
    return left;
  }

  function looksLikeCaseLabel() {
    ws();
    const m = /^([0-9]+(?:\s*,\s*[0-9]+)*|[A-Za-z_][A-Za-z0-9_]*)\s*:(?!=)/.exec(s.slice(i));
    return !!m;
  }

  function attachTrailingComment(blockXml) {
    // KASITLI OLARAK paylaşılan ws()'i DEĞİL, kendi ham boşluk taramasını
    // kullanıyor — ws() artık TRAIL_START/END işaretçilerini de atlıyor
    // (ifade-ortası yorumlar için, bkz. ws() üstündeki yorum), ama burada
    // ifade TAM BİTMİŞ durumda ve marker'ı KAYBETMEDEN yakalamamız gerekiyor.
    let j = i;
    while (j < n && /\s/.test(s[j])) j++;
    if (s[j] === TRAIL_START) {
      const end = s.indexOf(TRAIL_END, j + 1);
      if (end !== -1) {
        const txt = s.slice(j + 1, end);
        i = end + 1;
        const tagEnd = blockXml.indexOf(">");
        return blockXml.slice(0, tagEnd + 1) + "<comment pinned=\"false\" h=\"60\" w=\"200\">" + xmlEscape(txt) + "</comment>" + blockXml.slice(tagEnd + 1);
      }
    }
    return blockXml;
  }

  function parseOneStatement() {
    ws();
    if (peekKw("IF")) return parseIf();
    if (peekKw("CASE")) return parseCase();
    if (peekKw("FOR")) return parseFor();
    if (peekKw("CONTINUE")) { eatKw("CONTINUE"); tryEatCh(";"); return "<block type=\"st_continue\"></block>"; }
    const ident = matchIdentRaw();
    if (ident === null) throw new StParseHatasi("Beklenmeyen karakter (ifade/atama bekleniyordu)", i, s);
    ws();
    if (s[i] === "(") {
      i++;
      const args = parseArgList();
      eatCh(")");
      tryEatCh(";");
      if (ident === "__CMT__" && args.length === 1) {
        const raw = args[0].xml;
        const fm = /<field name="NAME">'((?:[^']|'')*)'<\/field>/.exec(raw);
        // txt burada zaten XML-escape edilmiş (STR_RE eşleşmesi xmlEscape'ten
        // geçmişti) — tekrar xmlEscape uygulamak &amp; gibi dizileri
        // &amp;amp;'e çevirip çift kaçışa yol açıyordu (gerçek koddaki
        // "//Start&Stop..." yorumunda bulundu). Burada TEKRAR escape ETME.
        const txt = fm ? fm[1].replace(/''/g, "'") : "";
        return "<block type=\"st_comment\"><field name=\"TXT\">" + txt + "</field></block>";
      }
      let out = "<block type=\"st_call\"><mutation args=\"" + args.length + "\" dirs=\"" + argDirsStr(args) + "\"></mutation>";
      out += "<field name=\"FUNC_NAME\">" + xmlEscape(ident) + "</field>";
      out += argsFieldsXml(args);
      out += "</block>";
      return attachTrailingComment(out);
    }
    if (s[i] === ":" && s[i + 1] === "=") {
      i += 2;
      const val = parseExpr();
      tryEatCh(";");
      const assignOut = "<block type=\"st_assign\"><field name=\"NAME\">" + xmlEscape(ident) + "</field><value name=\"VALUE\">" + val + "</value></block>";
      return attachTrailingComment(assignOut);
    }
    throw new StParseHatasi("'" + ident + "' sonrası '(' ya da ':=' bekleniyordu", i, s);
  }

  function parseStatements(stopFn) {
    const blocks = [];
    while (true) {
      ws();
      if (i >= n) break;
      if (stopFn()) break;
      blocks.push(parseOneStatement());
    }
    return chainBlockXml(blocks);
  }

  function parseIf() {
    eatKw("IF");
    const cond0 = parseExpr();
    eatKw("THEN");
    const do0 = parseStatements(function () { return peekKw("ELSIF") || peekKw("ELSE") || peekKw("END_IF"); });
    const elseifs = [];
    while (peekKw("ELSIF")) {
      eatKw("ELSIF");
      const c = parseExpr();
      eatKw("THEN");
      const b = parseStatements(function () { return peekKw("ELSIF") || peekKw("ELSE") || peekKw("END_IF"); });
      elseifs.push({ cond: c, body: b });
    }
    let elseBody = null;
    if (peekKw("ELSE")) { eatKw("ELSE"); elseBody = parseStatements(function () { return peekKw("END_IF"); }); }
    eatKw("END_IF");
    tryEatCh(";");
    let out = "<block type=\"st_if\"><mutation elseif=\"" + elseifs.length + "\" else=\"" + (elseBody !== null ? 1 : 0) + "\"></mutation>";
    out += "<value name=\"IF0\">" + cond0 + "</value>";
    if (do0) out += "<statement name=\"DO0\">" + do0 + "</statement>";
    elseifs.forEach(function (e, idx) {
      const k = idx + 1;
      out += "<value name=\"IF" + k + "\">" + e.cond + "</value>";
      if (e.body) out += "<statement name=\"DO" + k + "\">" + e.body + "</statement>";
    });
    if (elseBody !== null && elseBody) out += "<statement name=\"ELSE\">" + elseBody + "</statement>";
    out += "</block>";
    return out;
  }

  function parseCase() {
    eatKw("CASE");
    const expr = parseExpr();
    eatKw("OF");
    const arms = [];
    while (!peekKw("ELSE") && !peekKw("END_CASE")) {
      ws();
      const lm = /^([0-9]+(?:\s*,\s*[0-9]+)*|[A-Za-z_][A-Za-z0-9_]*)\s*:/.exec(s.slice(i));
      if (!lm) throw new StParseHatasi("CASE kolu etiketi bekleniyordu", i, s);
      i += lm[0].length;
      const body = parseStatements(function () { return peekKw("ELSE") || peekKw("END_CASE") || looksLikeCaseLabel(); });
      arms.push({ label: lm[1].replace(/\s+/g, ""), body: body });
    }
    let elseBody = null;
    if (peekKw("ELSE")) { eatKw("ELSE"); elseBody = parseStatements(function () { return peekKw("END_CASE"); }); }
    eatKw("END_CASE");
    tryEatCh(";");
    let out = "<block type=\"st_case\"><mutation cases=\"" + arms.length + "\" else=\"" + (elseBody !== null ? 1 : 0) + "\"></mutation>";
    out += "<value name=\"EXPR\">" + expr + "</value>";
    arms.forEach(function (a, idx) {
      const k = idx + 1;
      out += "<field name=\"LABEL" + k + "\">" + xmlEscape(a.label) + "</field>";
      if (a.body) out += "<statement name=\"DO" + k + "\">" + a.body + "</statement>";
    });
    if (elseBody !== null && elseBody) out += "<statement name=\"ELSE\">" + elseBody + "</statement>";
    out += "</block>";
    return out;
  }

  function parseFor() {
    eatKw("FOR");
    ws();
    const varName = matchIdentRaw();
    if (varName === null) throw new StParseHatasi("FOR değişkeni bekleniyordu", i, s);
    ws();
    if (s[i] !== ":" || s[i + 1] !== "=") throw new StParseHatasi("':=' bekleniyordu", i, s);
    i += 2;
    const startExpr = parseExpr();
    eatKw("TO");
    const endExpr = parseExpr();
    eatKw("DO");
    const body = parseStatements(function () { return peekKw("END_FOR"); });
    eatKw("END_FOR");
    tryEatCh(";");
    let out = "<block type=\"st_for\">";
    out += "<field name=\"VAR\">" + xmlEscape(varName) + "</field>";
    out += "<value name=\"START\">" + startExpr + "</value>";
    out += "<value name=\"END\">" + endExpr + "</value>";
    if (body) out += "<statement name=\"DO\">" + body + "</statement>";
    out += "</block>";
    return out;
  }

  const topBlocks = [];
  try {
    while (!atEnd()) {
      topBlocks.push(parseOneStatement());
    }
    return { ok: true, blocks: topBlocks, error: null };
  } catch (e) {
    if (e instanceof StParseHatasi) {
      return { ok: false, blocks: topBlocks, error: e.message, context: e.context };
    }
    return { ok: false, blocks: topBlocks, error: "Beklenmeyen hata: " + e.message, context: "" };
  }
}

document.getElementById("parseCodeBtn").addEventListener("click", function () {
  const text = document.getElementById("varInput").value;
  const result = parseStToBlockXml(text);
  const resultEl = document.getElementById("parseCodeResult");
  if (result.blocks.length === 0) {
    resultEl.textContent = result.ok ? t("parse_code_empty") : t("parse_code_fail_tpl", { error: result.error, context: result.context });
    return;
  }
  const xmlStr = "<xml xmlns=\"https://developers.google.com/blockly/xml\">" + chainBlockXml(result.blocks) + "</xml>";
  try {
    const dom = Blockly.utils.xml.textToDom(xmlStr);
    workspace.clear();
    Blockly.Xml.domToWorkspace(dom, workspace);
    workspace.cleanUp();
    // workspace.addChangeListener(render) Blockly'nin kendi olay kuyruğuna
    // bağlı olduğu için domToWorkspace sonrası HEMEN tetiklenmeyebiliyor —
    // gerçek kullanımda "Kodu Bloklara Çevir"e basınca sağdaki çıktı eski
    // (boş) haliyle kalıyordu, kullanıcı elle bir bloğa dokunana kadar.
    // Burada açıkça çağırarak anında güncel çıktı garantiliyoruz.
    render();
  } catch (e) {
    resultEl.textContent = t("parse_code_xml_fail_tpl", { error: e.message });
    return;
  }
  resultEl.textContent = result.ok
    ? t("parse_code_ok_tpl", { count: result.blocks.length })
    : t("parse_code_partial_tpl", { count: result.blocks.length, error: result.error, context: result.context });
});

})();
</script>
